services:
  - type: web
    name: sistema-pdf
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: gunicorn config.wsgi:application --workers=1 --bind 0.0.0.0:$PORT
    autoDeploy: true
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_prod
      - key: PYTHONUNBUFFERED
        value: 1
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-pdf-db
          property: connectionString
  - type: worker
    name: sistema-pdf-migrations
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: python manage.py migrate --noinput && python manage.py showmigrations core
    autoDeploy: true
databases:
  - name: sistema-pdf-db
    plan: free
